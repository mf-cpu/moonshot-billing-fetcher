# Codex 审查完成后发飞书通知
# 三色卡片：绿（通过）/ 黄（通过有建议）/ 红（未通过需审批）

name: "Codex Review"

on:
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >
      github.event.review.user.type == 'Bot' &&
      github.event.review.state != 'pending'
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      REPO: ${{ github.repository }}
      REVIEW_ID: ${{ github.event.review.id }}
    steps:
      - name: Fetch review comments and build notification
        shell: bash
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "未配置 FEISHU_WEBHOOK_URL，跳过"
            exit 0
          fi

          # 获取 PR 详情
          PR_DATA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" 2>/dev/null || echo '{}')
          ADDITIONS=$(echo "$PR_DATA" | jq -r '.additions // 0')
          DELETIONS=$(echo "$PR_DATA" | jq -r '.deletions // 0')
          CHANGED_FILES=$(echo "$PR_DATA" | jq -r '.changed_files // 0')

          # 获取 review comments
          COMMENTS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews/$REVIEW_ID/comments" 2>/dev/null || echo '[]')
          TOTAL=$(echo "$COMMENTS" | jq 'length')

          # 分类 P0 和 P1
          P0_COUNT=$(echo "$COMMENTS" | jq '[.[] | select(.body | test("🔴|必须修复|P0|critical"; "i"))] | length')
          P1_COUNT=$((TOTAL - P0_COUNT))

          # 生成 P0 摘要
          P0_SUMMARY=""
          if [ "$P0_COUNT" -gt 0 ]; then
            P0_SUMMARY=$(echo "$COMMENTS" | jq -r '
              [.[] | select(.body | test("🔴|必须修复|P0|critical"; "i"))] | .[:5][] |
              .path as $p | .body |
              gsub("!\\[[^\\]]*\\]\\([^)]*\\)"; "") |
              gsub("[*🔴🚨#]"; "") |
              split("\n") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 2)) |
              (if length > 0 then .[0] else "查看详情" end) |
              (if length > 60 then .[:60] + "..." else . end) |
              "🔴 \($p): \(.)"
            ')
          fi

          # 生成 P1 摘要
          P1_SUMMARY=""
          if [ "$P1_COUNT" -gt 0 ]; then
            P1_SUMMARY=$(echo "$COMMENTS" | jq -r '
              [.[] | select(.body | test("🔴|必须修复|P0|critical"; "i") | not)] | .[:3][] |
              .path as $p | .body |
              gsub("!\\[[^\\]]*\\]\\([^)]*\\)"; "") |
              gsub("[*🟡#]"; "") |
              split("\n") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 2)) |
              (if length > 0 then .[0] else "查看详情" end) |
              (if length > 60 then .[:60] + "..." else . end) |
              "🟡 \($p): \(.)"
            ')
          fi

          # 合并摘要
          SUMMARY_LINES=""
          if [ -n "$P0_SUMMARY" ]; then SUMMARY_LINES="$P0_SUMMARY"; fi
          if [ -n "$P1_SUMMARY" ]; then
            if [ -n "$SUMMARY_LINES" ]; then
              SUMMARY_LINES="$SUMMARY_LINES
          $P1_SUMMARY"
            else
              SUMMARY_LINES="$P1_SUMMARY"
            fi
          fi

          # 决定卡片颜色
          if [ "$P0_COUNT" -gt 0 ]; then
            CARD_COLOR="red"
            CONCLUSION="❌ Codex 审查结论：未通过"
            DETAIL="发现 ${P0_COUNT} 个必须修复问题，需人工审批才能合并"
          elif [ "$P1_COUNT" -gt 0 ]; then
            CARD_COLOR="yellow"
            CONCLUSION="✅ Codex 审查结论：通过（有 ${P1_COUNT} 条建议）"
            DETAIL="无必须修复问题，以下建议供参考"
          else
            CARD_COLOR="green"
            CONCLUSION="✅ Codex 审查结论：通过"
            DETAIL="未发现问题，可直接合并"
          fi

          echo "卡片: $CARD_COLOR P0=$P0_COUNT P1=$P1_COUNT +$ADDITIONS -$DELETIONS ($CHANGED_FILES files)"

          # 构建 elements
          ELEMENTS_FILE=$(mktemp)

          jq -n \
            --arg repo "$REPO" \
            --arg author "$PR_AUTHOR" \
            --arg number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg adds "$ADDITIONS" \
            --arg dels "$DELETIONS" \
            --arg files "$CHANGED_FILES" \
            --arg conclusion "$CONCLUSION" \
            --arg detail "$DETAIL" \
            '[
              {tag:"div",fields:[
                {is_short:true,text:{tag:"lark_md",content:("**仓库**\n"+$repo)}},
                {is_short:true,text:{tag:"lark_md",content:("**提交人**\n"+$author)}}
              ]},
              {tag:"div",fields:[
                {is_short:true,text:{tag:"lark_md",content:("**PR**\n#"+$number+" "+$title)}},
                {is_short:true,text:{tag:"lark_md",content:("**变更**\n+"+$adds+" -"+$dels+"（"+$files+" 个文件）")}}
              ]},
              {tag:"hr"},
              {tag:"div",text:{tag:"lark_md",content:("**"+$conclusion+"**\n"+$detail)}}
            ]' > "$ELEMENTS_FILE"

          if [ -n "$SUMMARY_LINES" ]; then
            jq --arg s "$SUMMARY_LINES" '. + [{tag:"div",text:{tag:"lark_md",content:$s}}]' "$ELEMENTS_FILE" > "${ELEMENTS_FILE}.tmp"
            mv "${ELEMENTS_FILE}.tmp" "$ELEMENTS_FILE"
          fi

          if [ "$CARD_COLOR" = "red" ]; then
            jq --arg u "$PR_URL" '. + [{tag:"hr"},{tag:"action",actions:[{tag:"button",text:{tag:"plain_text",content:"查看 PR"},type:"default",url:$u},{tag:"button",text:{tag:"plain_text",content:"前往审批"},type:"primary",url:($u+"/files")}]}]' "$ELEMENTS_FILE" > "${ELEMENTS_FILE}.tmp"
          else
            jq --arg u "$PR_URL" '. + [{tag:"hr"},{tag:"action",actions:[{tag:"button",text:{tag:"plain_text",content:"查看 PR"},type:"primary",url:$u}]}]' "$ELEMENTS_FILE" > "${ELEMENTS_FILE}.tmp"
          fi
          mv "${ELEMENTS_FILE}.tmp" "$ELEMENTS_FILE"

          CARD=$(jq -n --arg color "$CARD_COLOR" --slurpfile el "$ELEMENTS_FILE" '{
            msg_type:"interactive",
            card:{
              header:{title:{tag:"plain_text",content:"Codex Review"},template:$color},
              elements:$el[0]
            }
          }')
          rm -f "$ELEMENTS_FILE"

          # 发送飞书（3 次重试）
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /tmp/feishu_resp.txt -w "%{http_code}" -X POST "$FEISHU_WEBHOOK_URL" \
              -H "Content-Type: application/json" -d "$CARD")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "飞书通知已发送 [$CARD_COLOR]"
              exit 0
            fi
            echo "第${i}次失败(HTTP $HTTP_CODE): $(cat /tmp/feishu_resp.txt)"
            sleep 2
          done
          echo "飞书通知发送失败"

          # 有 P0 问题时让 workflow 失败，阻止 PR 合并
          if [ "$CARD_COLOR" = "red" ]; then
            echo "::error::Codex Review 未通过：发现 ${P0_COUNT} 个 P0 问题，需人工 bypass 才能合并"
            exit 1
          fi
