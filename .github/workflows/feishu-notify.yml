# Codex 审查完成后发飞书通知
# 三色卡片：绿（通过）/ 黄（通过有建议）/ 红（未通过需审批）

name: "🦞 飞书审查通知"

on:
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >
      github.event.review.user.type == 'Bot' &&
      github.event.review.state != 'pending'
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      REPO: ${{ github.repository }}
      REVIEW_ID: ${{ github.event.review.id }}
    steps:
      - name: Fetch review comments and build notification
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "未配置 FEISHU_WEBHOOK_URL，跳过"
            exit 0
          fi

          # 通过 API 获取 PR 详情（确保拿到变更数据）
          PR_DATA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" 2>/dev/null || echo "{}")
          ADDITIONS=$(echo "$PR_DATA" | jq -r '.additions // 0')
          DELETIONS=$(echo "$PR_DATA" | jq -r '.deletions // 0')
          CHANGED_FILES=$(echo "$PR_DATA" | jq -r '.changed_files // 0')

          # 获取本次 review 的 inline comments
          COMMENTS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews/$REVIEW_ID/comments" 2>/dev/null || echo "[]")
          TOTAL=$(echo "$COMMENTS" | jq 'length')

          # 按 P0（必须修复）和 P1（建议修复）分类
          P0_COUNT=$(echo "$COMMENTS" | jq '[.[] | select(.body | test("🔴|必须修复|P0|critical"; "i"))] | length')
          P1_COUNT=$((TOTAL - P0_COUNT))

          # 提取问题摘要：剥离 markdown 图片语法，取第一行有意义的文字
          extract_summary() {
            echo "$1" | jq -r "$2"' | .[:5][] |
              "'"$3"'" + .path + ": " + (
                .body
                | gsub("!\\[[^]]*\\]\\([^)]*\\)"; "")
                | gsub("[*🔴🚨🟡#]"; "")
                | split("\n")
                | map(ltrimstr(" ") | rtrimstr(" "))
                | map(select(length > 2))
                | if length > 0 then .[0] else "查看详情" end
                | if length > 60 then .[:60] + "..." else . end
              )'
          }

          SUMMARY_LINES=""
          if [ "$P0_COUNT" -gt 0 ]; then
            P0_TEXT=$(extract_summary "$COMMENTS" '[.[] | select(.body | test("🔴|必须修复|P0|critical"; "i"))]' '🔴 ')
            SUMMARY_LINES="$P0_TEXT"
          fi
          if [ "$P1_COUNT" -gt 0 ]; then
            P1_TEXT=$(extract_summary "$COMMENTS" '[.[] | select(.body | test("🔴|必须修复|P0|critical"; "i") | not)]' '🟡 ')
            if [ -n "$SUMMARY_LINES" ] && [ -n "$P1_TEXT" ]; then
              SUMMARY_LINES="${SUMMARY_LINES}
${P1_TEXT}"
            elif [ -n "$P1_TEXT" ]; then
              SUMMARY_LINES="$P1_TEXT"
            fi
          fi

          # 决定卡片颜色和结论
          if [ "$P0_COUNT" -gt 0 ]; then
            CARD_COLOR="red"
            CONCLUSION="❌ Codex 审查结论：未通过"
            DETAIL="发现 ${P0_COUNT} 个必须修复问题，需人工审批才能合并"
          elif [ "$P1_COUNT" -gt 0 ]; then
            CARD_COLOR="yellow"
            CONCLUSION="✅ Codex 审查结论：通过（有 ${P1_COUNT} 条建议）"
            DETAIL="无必须修复问题，以下建议供参考"
          else
            CARD_COLOR="green"
            CONCLUSION="✅ Codex 审查结论：通过"
            DETAIL="未发现问题，可直接合并"
          fi

          echo "卡片颜色: $CARD_COLOR, P0=$P0_COUNT, P1=$P1_COUNT"
          echo "变更: +$ADDITIONS -$DELETIONS ($CHANGED_FILES files)"

          # 构建 elements 数组写入临时文件
          ELEMENTS_FILE=$(mktemp)

          jq -n \
            --arg repo "$REPO" \
            --arg author "$PR_AUTHOR" \
            --arg number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg adds "$ADDITIONS" \
            --arg dels "$DELETIONS" \
            --arg files "$CHANGED_FILES" \
            --arg conclusion "$CONCLUSION" \
            --arg detail "$DETAIL" \
            '[
              {tag: "div", fields: [
                {is_short: true, text: {tag: "lark_md", content: ("**仓库**\n" + $repo)}},
                {is_short: true, text: {tag: "lark_md", content: ("**提交人**\n" + $author)}}
              ]},
              {tag: "div", fields: [
                {is_short: true, text: {tag: "lark_md", content: ("**PR**\n#" + $number + " " + $title)}},
                {is_short: true, text: {tag: "lark_md", content: ("**变更**\n+" + $adds + " -" + $dels + "（" + $files + " 个文件）")}}
              ]},
              {tag: "hr"},
              {tag: "div", text: {tag: "lark_md", content: ("**" + $conclusion + "**\n" + $detail)}}
            ]' > "$ELEMENTS_FILE"

          # 如果有问题摘要，追加到 elements
          if [ -n "$SUMMARY_LINES" ]; then
            UPDATED=$(jq --arg summary "$SUMMARY_LINES" \
              '. + [{tag: "div", text: {tag: "lark_md", content: $summary}}]' "$ELEMENTS_FILE")
            echo "$UPDATED" > "$ELEMENTS_FILE"
          fi

          # 追加分隔线和按钮
          if [ "$CARD_COLOR" = "red" ]; then
            UPDATED=$(jq --arg url "$PR_URL" \
              '. + [
                {tag: "hr"},
                {tag: "action", actions: [
                  {tag: "button", text: {tag: "plain_text", content: "查看 PR"}, type: "default", url: $url},
                  {tag: "button", text: {tag: "plain_text", content: "前往审批"}, type: "primary", url: ($url + "/files")}
                ]}
              ]' "$ELEMENTS_FILE")
          else
            UPDATED=$(jq --arg url "$PR_URL" \
              '. + [
                {tag: "hr"},
                {tag: "action", actions: [
                  {tag: "button", text: {tag: "plain_text", content: "查看 PR"}, type: "primary", url: $url}
                ]}
              ]' "$ELEMENTS_FILE")
          fi
          echo "$UPDATED" > "$ELEMENTS_FILE"

          # 组装完整卡片
          CARD=$(jq -n --arg color "$CARD_COLOR" --slurpfile elements "$ELEMENTS_FILE" '{
            msg_type: "interactive",
            card: {
              header: {
                title: {tag: "plain_text", content: "🦞 龙虾 CR Agent"},
                template: $color
              },
              elements: $elements[0]
            }
          }')

          rm -f "$ELEMENTS_FILE"

          # 发送到飞书（3 次重试）
          for i in 1 2 3; do
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$FEISHU_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$CARD")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            if [ "$HTTP_CODE" = "200" ]; then
              echo "飞书通知已发送 [$CARD_COLOR] P0=$P0_COUNT P1=$P1_COUNT"
              exit 0
            fi
            echo "第 ${i} 次发送失败 (HTTP $HTTP_CODE): $BODY"
            sleep 2
          done
          echo "飞书通知发送失败，已重试 3 次"
          exit 1
